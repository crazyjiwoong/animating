name: PC 앱 빌드 (Windows · macOS)

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 설치 파일 만들기
        run: npx electron-builder --publish never
        env:
          # 코드 서명 인증서가 없으므로 서명은 건너뛴다
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: FrameFlow-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 30
